<!-- Barra Superior com Nome do Usuário -->
<div class="topbar" *ngIf="authService.isAuthenticated">
  <div class="topbar-content">
    <button class="mobile-menu-btn" (click)="toggleMenu()">
      <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

    <div class="topbar-clock">
      <svg class="topbar-clock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
      <span class="topbar-clock-text">{{ dataHoraAtual }}</span>
    </div>

    <div class="topbar-user" *ngIf="usuarioAutenticado">
      <span class="topbar-user-name">{{ usuarioAutenticado.nome }}</span>
      <div class="topbar-user-avatar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
        </svg>
      </div>
    </div>
  </div>
</div>

<div class="sidebar" [class.active]="menuOpen" *ngIf="authService.isAuthenticated">
  <div class="sidebar-header">
    <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
    </svg>
    <span class="sidebar-title">Sistema ISSQN</span>
  </div>

  <nav class="sidebar-nav">
    <a routerLink="/dashboard" routerLinkActive="active" class="sidebar-link" (click)="toggleMenu()">
      <svg class="link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
      </svg>
      <span class="link-text">Dashboard</span>
    </a>
    <a routerLink="/consultar" routerLinkActive="active" class="sidebar-link" (click)="toggleMenu()">
      <svg class="link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
      <span class="link-text">Consultar Créditos</span>
    </a>
  </nav>

  <!-- Botão de Logout -->
  <div class="sidebar-footer">
    <button class="logout-btn" (click)="logout()">
      <svg class="logout-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
      </svg>
      <span class="logout-text">Sair</span>
    </button>
  </div>
</div>

<div class="sidebar-overlay" [class.active]="menuOpen" (click)="toggleMenu()"></div>
